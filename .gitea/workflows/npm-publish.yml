# Publish @b4m/calengine to the internal Gitea Packages npm registry.
# package.json name is @b4moss/calengine (npmjs); this workflow temporarily
# rewrites name to @b4m/calengine and publishes with --registry.
# Triggers on plain SemVer tags vX.Y.Z (suffix tags like v0.1.0-doc.1 are skipped).
# The same tag also triggers GitHub Actions .github/workflows/publish.yml (npmjs)
# after the Gitea → GitHub push mirror delivers the tag. The two publishes are
# independent; a failure on one does not roll back the other.
name: npm-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.0). Required for manual runs.'
        required: true
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version / tag filter
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "skip=true" >>"$GITHUB_OUTPUT"
              echo "Skipping non-release tag: ${TAG}"
              exit 0
            fi
            VERSION="${TAG#v}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "Publish version: ${VERSION}"

      - name: Check secret
        if: steps.meta.outputs.skip != 'true'
        id: secret
        env:
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PACKAGE_REGISTRY_TOKEN:-}" ]]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::error::PACKAGE_REGISTRY_TOKEN is not set. Create a Packages write token and add the repo secret."
            exit 1
          fi

      - name: Setup Node
        if: steps.meta.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify tag matches package.json version
        if: steps.meta.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${VERSION}" ]]; then
            echo "Tag/version ${VERSION} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
          echo "Version ${VERSION} matches package.json"

      - name: Configure npm auth for internal registry
        if: steps.meta.outputs.skip != 'true'
        env:
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cat > .npmrc <<EOF
          @b4m:registry=https://git.b4m.jp/api/packages/b4m-packages/npm/
          //git.b4m.jp/api/packages/b4m-packages/npm/:_authToken=${PACKAGE_REGISTRY_TOKEN}
          //git.b4m.jp/api/packages/b4m-packages/npm/:always-auth=true
          EOF

      - name: Install & build
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Publish as @b4m/calengine to internal registry
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          INTERNAL_REGISTRY="https://git.b4m.jp/api/packages/b4m-packages/npm/"
          node <<'EOF'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@b4m/calengine';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          npm publish --access restricted --registry "${INTERNAL_REGISTRY}"
