# Publish @b4moss/calengine to npmjs.org (Trusted Publishing / OIDC).
# Triggers on plain SemVer tags vX.Y.Z (push), or manual workflow_dispatch
# with --ref vX.Y.Z (needed because Gitea→GitHub git push --mirror does not
# create tag push events that start Actions).
name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish (@b4moss/calengine)
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # Release publishes must not rely on a restored npm cache.

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          echo "npm version: ${NPM_VERSION}"
          if ! node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            process.exit(ok ? 0 : 1);
          ' "${NPM_VERSION}"; then
            echo "npm ${NPM_VERSION} is below 11.5.1; upgrading"
            npm install -g npm@^11.5.1
            npm --version
          fi

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          TAG="${GITHUB_REF_NAME}"
          EVENT="${GITHUB_EVENT_NAME}"
          # Push tag triggers and workflow_dispatch --ref vX.Y.Z both set
          # github.ref to refs/tags/vX.Y.Z (GITHUB_REF_NAME = vX.Y.Z).
          if [[ ! "${REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ref ${REF} is not a plain SemVer tag refs/tags/vX.Y.Z (event=${EVENT})" >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="v${VERSION}"
          if [[ "${TAG}" != "${EXPECTED}" ]]; then
            echo "Tag ${TAG} does not match package.json version ${VERSION} (expected ${EXPECTED})" >&2
            exit 1
          fi
          echo "Tag ${TAG} matches package.json version ${VERSION} (event=${EVENT})"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: npm pack --dry-run
        run: npm pack --dry-run

      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${NAME}@${VERSION} already on npm"
            exit 0
          fi
          npm publish --access public --provenance
